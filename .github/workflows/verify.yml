name: Verify locked Bend
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan-low-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      required: ${{ steps.plan.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect changes to the low-memory verification path
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess

          paths = {
              b".github/workflows/verify.yml",
              b"build.sh", b"setup.sh", b"verify.sh",
              b"toolchain-env.sh", b"toolchain.lock.json",
              b"qa/low_memory.py", b"qa/test_low_memory.py",
              b"qa/toolchain.py", b"qa/verify_gates.sh", b"qa/verify_isolated.py",
          }
          event = os.environ["EVENT"]
          base, head = os.environ["BASE"], os.environ["HEAD"]
          required = True
          # Manual runs and diffs that cannot be determined run the full lane.
          if (event in {"pull_request", "push"}
              and all(re.fullmatch("[0-9a-f]{40}", sha) for sha in (base, head))):
              comparison = [f"{base}...{head}"] if event == "pull_request" else [base, head]
              try:
                  changed = subprocess.check_output(
                      ["git", "diff", "--no-renames", "--name-only", "-z", *comparison, "--"]
                  ).split(b"\0")
              except subprocess.CalledProcessError:
                  print("::warning::Could not compare commits; requiring full low-memory verification")
              else:
                  required = not paths.isdisjoint(changed)
          print(f"Full low-memory verification required: {required}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"required={str(required).lower()}", file=output)
          PY

  verify-ordinary-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - &checkout
        uses: actions/checkout@v4
      - &prerequisites
        name: Native prerequisites
        run: sudo apt-get update && sudo apt-get install -y zstd libffi8 libedit2 libz3-4 libxml2 libtinfo6
      - &toolchain
        name: Install checksum-locked toolchain
        run: ./setup.sh
      - name: Run proof checks
        run: ./verify.sh --skip-benchmark --group proof

  verify-ordinary-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - *checkout
      - *prerequisites
      - *toolchain
      - name: Run engine checks
        run: ./verify.sh --skip-benchmark --group engine

  verify-ordinary-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - *checkout
      - *prerequisites
      - *toolchain
      - name: Run core checks
        run: ./verify.sh --skip-benchmark --group core

  verify-ordinary-arithmetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - *checkout
      - *prerequisites
      - *toolchain
      - name: Run arithmetic checks
        run: ./verify.sh --skip-benchmark --group arithmetic

  verify-ordinary-rating:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - *checkout
      - *prerequisites
      - *toolchain
      - name: Run rating checks
        run: ./verify.sh --skip-benchmark --group rating

  verify-ordinary-mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - *checkout
      - *prerequisites
      - *toolchain
      - name: Run mutation checks
        run: ./verify.sh --skip-benchmark --group mutation

  verify-sequential-proof:
    needs: plan-low-memory
    if: ${{ needs.plan-low-memory.outputs.required == 'true' }}
    runs-on: ubuntu-24.04
    # Budget for sequential precheck, export, and the independent kernel verdict.
    timeout-minutes: 75
    steps:
      - *checkout
      - *prerequisites
      - *toolchain
      - name: Run proof checks
        env:
          VERIFY_PHASE_TIMINGS: "1"
        run: ./verify.sh --low-memory --skip-benchmark --group proof

  verify-sequential-engine:
    needs: plan-low-memory
    if: ${{ needs.plan-low-memory.outputs.required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - *checkout
      - *prerequisites
      - *toolchain
      - name: Run engine checks
        env:
          VERIFY_PHASE_TIMINGS: "1"
        run: ./verify.sh --low-memory --skip-benchmark --group engine

  verify-sequential-core:
    needs: plan-low-memory
    if: ${{ needs.plan-low-memory.outputs.required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - *checkout
      - *prerequisites
      - *toolchain
      - name: Run core checks
        run: ./verify.sh --low-memory --skip-benchmark --group core

  verify-sequential-arithmetic:
    needs: plan-low-memory
    if: ${{ needs.plan-low-memory.outputs.required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - *checkout
      - *prerequisites
      - *toolchain
      - name: Run arithmetic checks
        run: ./verify.sh --low-memory --skip-benchmark --group arithmetic

  verify-sequential-rating:
    needs: plan-low-memory
    if: ${{ needs.plan-low-memory.outputs.required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - *checkout
      - *prerequisites
      - *toolchain
      - name: Run rating checks
        run: ./verify.sh --low-memory --skip-benchmark --group rating

  verify-sequential-mutation:
    needs: plan-low-memory
    if: ${{ needs.plan-low-memory.outputs.required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - *checkout
      - *prerequisites
      - *toolchain
      - name: Run mutation checks
        run: ./verify.sh --low-memory --skip-benchmark --group mutation

  verify-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - *checkout
      - name: Python regressions
        run: |
          python3 -m unittest discover -s qa -p 'test_*.py' -v
          python3 -m unittest discover -s qa/compiler-20261106 -p 'test_*.py' -v
          python3 qa/compiler-20261106/check_js.py --self-test

  verify-boundary-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - *checkout
      - *prerequisites
      - *toolchain
      - name: Compiler and independent kernel boundary
        run: |
          mkdir -p .verification/upgrade
          python3 qa/compiler-20261106/check_real.py --out .verification/upgrade/kernel.json

  verify-boundary-js:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - *checkout
      - *prerequisites
      - *toolchain
      - name: Native and Node compiler boundary
        run: |
          ./build.sh
          mkdir -p .verification/upgrade
          python3 qa/compiler-20261106/check_js.py --out .verification/upgrade/js.json

  # Keep the required check name; only explicitly unneeded jobs may be skipped.
  verify:
    needs:
      - plan-low-memory
      - verify-ordinary-proof
      - verify-ordinary-engine
      - verify-ordinary-core
      - verify-ordinary-arithmetic
      - verify-ordinary-rating
      - verify-ordinary-mutation
      - verify-sequential-proof
      - verify-sequential-engine
      - verify-sequential-core
      - verify-sequential-arithmetic
      - verify-sequential-rating
      - verify-sequential-mutation
      - verify-python
      - verify-boundary-kernel
      - verify-boundary-js
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable verification job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          jobs = json.loads(os.environ["RESULTS"])
          for name, job in sorted(jobs.items()):
              print(f"{name}: {job['result']}")
          groups = {"proof", "engine", "core", "arithmetic", "rating", "mutation"}
          always = {"plan-low-memory", "verify-python", "verify-boundary-kernel",
                    "verify-boundary-js"} | {f"verify-ordinary-{group}" for group in groups}
          conditional = {f"verify-sequential-{group}" for group in groups}
          required = jobs.get("plan-low-memory", {}).get("outputs", {}).get("required")
          expected = "success" if required == "true" else "skipped"
          sys.exit(0 if (
              set(jobs) == always | conditional and required in {"true", "false"}
              and all(jobs[name]["result"] == "success" for name in always)
              and all(jobs[name]["result"] == expected for name in conditional)
          ) else 1)
          PY

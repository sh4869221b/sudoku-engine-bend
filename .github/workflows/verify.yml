name: Verify locked Bend
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-ordinary:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Python regressions
        run: |
          python3 -m unittest discover -s qa -p 'test_*.py' -v
          python3 -m unittest discover -s qa/compiler-20261106 -p 'test_*.py' -v
          python3 qa/compiler-20261106/check_js.py --self-test
      - name: Native prerequisites
        run: sudo apt-get update && sudo apt-get install -y zstd libffi8 libedit2 libz3-4 libxml2 libtinfo6
      - name: Install checksum-locked toolchain
        run: ./setup.sh
      - name: Verify ordinary compiler path
        run: ./verify.sh --skip-benchmark

  verify-sequential:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Native prerequisites
        run: sudo apt-get update && sudo apt-get install -y zstd libffi8 libedit2 libz3-4 libxml2 libtinfo6
      - name: Install checksum-locked toolchain
        run: ./setup.sh
      - name: Verify sequential compiler path
        run: ./verify.sh --low-memory --skip-benchmark

  verify-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Native prerequisites
        run: sudo apt-get update && sudo apt-get install -y zstd libffi8 libedit2 libz3-4 libxml2 libtinfo6
      - name: Install checksum-locked toolchain
        run: ./setup.sh
      - name: Compiler boundary checks
        run: |
          ./build.sh
          mkdir -p .verification/upgrade
          python3 qa/compiler-20261106/check_real.py --out .verification/upgrade/kernel.json
          python3 qa/compiler-20261106/check_js.py --out .verification/upgrade/js.json

  # Keep the existing check name for branch protection; skipped or cancelled lanes must not pass.
  verify:
    needs: [verify-ordinary, verify-sequential, verify-boundary]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification job to succeed
        env:
          ORDINARY_RESULT: ${{ needs.verify-ordinary.result }}
          SEQUENTIAL_RESULT: ${{ needs.verify-sequential.result }}
          BOUNDARY_RESULT: ${{ needs.verify-boundary.result }}
        run: |
          printf 'ordinary=%s sequential=%s boundary=%s\n' "$ORDINARY_RESULT" "$SEQUENTIAL_RESULT" "$BOUNDARY_RESULT"
          test "$ORDINARY_RESULT" = success &&
            test "$SEQUENTIAL_RESULT" = success &&
            test "$BOUNDARY_RESULT" = success
